# Anchor workspace. The program is programs/carbon_registry. `anchor build` and `anchor test` run from here.
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
