# What was asked for (the "spec box"). Read by ai-code-quality-auditor for the scope-drift check:
#   auditor scan . --spec spec.yaml
# A route or command with no feature here counts as drift. Sources: CLAUDE.md, docs/AUTONOMOUS-RUN.md, docs/ux/FLOWS.md.
name: carbonledger
description: >
  A register for simulated pilot carbon units: estimate a footprint, retire units once with a fresh serial range,
  anchor hash-chained receipts on Solana, verify any receipt, let an agent retire only under a signed mandate.
features:
  - id: health.check
    description: GET /health says the chain mode, the unit status and the anchor counts.
  - id: registry.summary
    description: GET /v1/registry/summary shows issued, retired and remaining pilot units.
  - id: retire.units
    description: POST /v1/retire retires pilot units with a fresh serial range, priced by the server, idempotent.
  - id: receipts.get
    description: GET /v1/receipts/{id} returns a receipt entry and its anchor state.
  - id: receipts.proof
    description: GET /v1/receipts/{id}/proof returns the Merkle path to the anchored root.
  - id: audit.verify
    description: GET /v1/audit/verify checks the whole receipt chain and names the first bad index.
  - id: mandates.create
    description: POST /v1/mandates lets a business key set a cap, allow-list, expiry and agent public key.
  - id: mandates.revoke
    description: POST /v1/mandates/{id}/revoke lets the owner revoke a mandate.
  - id: accounts.totals
    description: GET /v1/accounts/me/totals gives an owner's own totals from server records.
  - id: accounts.history
    description: GET /v1/accounts/me/history gives an owner's own receipts.
  - id: accounts.mandates
    description: GET /v1/accounts/me/mandates lists an owner's mandates with use against cap.
  - id: web.app
    description: The static app served from the API's origin (shop, travel, daily, countries, me, business, verify).
  # Added 2026-11-15: features Rume asked for and shipped after the first spec (commits d745f72, b725094,
  # 6e770c9, a24d59d), so the scope-drift check measures against what was actually requested.
  - id: world.stats
    description: GET /v1/stats/world gives public totals by country and the register, with no personal data.
  - id: demo.login
    description: POST /v1/demo/key mints a demo login for pilot units, a few an hour per client address, demo only.
  - id: audit.export
    description: GET /v1/audit/receipts.json exports the receipt chain in the KYA receipt format, ids and hashes only.
  - id: usage.events
    description: POST /v1/events counts one named event per day, storing no id, address or device.
  - id: usage.metrics
    description: GET /v1/metrics shows the operator usage counts, funnel and return rate, behind METRICS_TOKEN.
  - id: auth.email
    description: POST /v1/auth/email sends a one-time sign-in link so a person can save progress to an account.
  - id: auth.verify
    description: POST /v1/auth/verify uses a sign-in link once and joins the browser's earlier login to the account.
  - id: auth.seeker
    description: POST /v1/auth/seeker/challenge and /v1/auth/seeker/verify sign in with a Solana wallet message, no transaction.
  - id: accounts.profile
    description: GET and PUT /v1/accounts/me/profile read and set the public display name, filtered.
  - id: accounts.delete
    description: DELETE /v1/accounts/me deletes the person's email, name and links and switches off their logins.
  - id: accounts.statement
    description: GET /v1/accounts/me/statement downloads a CSV statement, each line with its receipt id.
  - id: league.weekly
    description: GET /v1/league ranks players by XP for the week, never by footprint size, with pseudonyms.
  - id: studio.page
    description: GET /studio and the studio subdomain serve VOREM Studio, the film directing page.
  - id: studio.status
    description: GET /v1/studio/status says whether directing is switched on and which model it uses.
  - id: studio.direct
    description: POST /v1/studio/direct turns a brief into film beats, behind an access code and a rate limit.
  - id: web.landing
    description: GET / serves the public landing page; GET /app serves the app shell.
  # Added 2026-11-15: test-mode payments (docs/DECISIONS.md 2026-11-15, DEBT D29), asked for by Rume and the partner.
  - id: pay.quote
    description: POST /v1/pay/quote prices a retirement in Solana devnet test tokens with a one-time Solana Pay reference; test mode only.
  - id: pay.status
    description: GET /v1/pay/{reference} reports whether the test payment for a quote is confirmed on Solana devnet.
  - id: admin.suspend
    description: POST /v1/admin/projects/{id}/suspend lets an authority key suspend a project so nothing more is issued or retired from it (D24).
  - id: admin.reanchor
    description: POST /v1/admin/anchors/{id}/reanchor lets an authority key re-queue a receipt whose anchor failed; an anchored one never moves (D24).
