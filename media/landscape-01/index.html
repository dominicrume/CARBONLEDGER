<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>CarbonLedger landscape 01</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,700&display=swap">
<style>
  /* Landscape explainer. Rume Dominic presents: full body for the open and the close, a round portrait in between.
     Type follows Rume's own videos: a small italic serif lead-in over one bold keyword, one colour accent.
     Every frame is a pure function of time (render(t)), so renders are exact and repeatable. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08100c; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Outfit, sans-serif; color: #f4ecdc;
    background: radial-gradient(70% 90% at 30% 40%, #14261d 0%, #0b1510 55%, #070d0a 100%); }
  #cam { position: absolute; inset: 0; transform-origin: 40% 50%; }
  #dots { position: absolute; inset: -40px; opacity: .07;
    background-image: radial-gradient(circle, #f4ecdc 1.4px, transparent 1.6px); background-size: 16px 16px; }
  #glow { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; filter: blur(40px);
    background: radial-gradient(circle, rgba(249,115,22,.22), rgba(249,115,22,0) 65%); }
  #motes { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }

  .brand { position: absolute; left: 64px; top: 44px; display: flex; gap: 14px; align-items: center; z-index: 5; }
  .brand img { width: 44px; height: 44px; }
  .brand b { font: 400 40px/1 'DM Serif Display', serif; } .brand i { font: italic 400 40px/1 'DM Serif Display', serif; color: #3ddc97; }
  .brand .with { margin-left: 18px; padding-left: 18px; border-left: 2px solid rgba(244,236,220,.25); font: 700 18px Outfit; letter-spacing: .22em; color: rgba(244,236,220,.7); }
  .pilot { position: absolute; right: 64px; top: 50px; z-index: 5; font: 700 17px Outfit; letter-spacing: .08em; text-transform: uppercase;
    color: #7a4a00; background: #fff4dc; border-radius: 999px; padding: 9px 18px; }

  /* the visual card (left) */
  #card { position: absolute; left: 64px; top: 124px; width: 880px; height: 880px; border-radius: 32px; overflow: hidden;
    background: radial-gradient(90% 80% at 35% 30%, #1f3329, #121e18 78%);

  #card .chip { position: absolute; left: 30px; top: 26px; font: 700 16px 'DM Mono', monospace; letter-spacing: .14em; color: #e0b25c; z-index: 2; }
  #card .chip span { color: rgba(244,236,220,.5); }
  #wipe { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

  .c { fill: none; stroke: #efe6cf; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .g { fill: none; stroke: #e0b25c; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .gr { fill: none; stroke: #3ddc97; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }

  .scene { opacity: 0; }

  /* type: italic serif lead-in, bold keyword, highlighter bar under the accent line */
  #cap { position: absolute; z-index: 6; }
  #cap .lead { font: italic 500 58px/1 'Playfair Display', serif; color: rgba(244,236,220,.82); margin-bottom: 10px; }
  #cap .big { font: 900 132px/0.95 Outfit; letter-spacing: -.02em; text-transform: uppercase; }
  #cap .ln { display: block; position: relative; width: max-content; }
  #cap .w { display: inline-block; }
  #cap .hot { background: linear-gradient(90deg, #f97316, #f5b041); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #cap .bar { position: absolute; left: 0; bottom: 4px; height: 12px; border-radius: 6px; background: #f97316; opacity: .9; z-index: -1; }
  #sub { position: absolute; z-index: 6; font: 600 38px/1.32 Outfit; color: #f4ecdc; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  #sub span { opacity: .95; } #sub em { font-style: normal; color: #f5b041; }

  /* presenter */
  #hero { position: absolute; left: 1240px; top: 160px; width: 560px; height: 1010px; z-index: 4; }
  #hero img { position: absolute; left: 0; bottom: -40px; width: 560px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.55)); }
  #heroGlow { position: absolute; left: 1150px; top: 190px; width: 760px; height: 760px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle, rgba(245,176,65,.45), rgba(249,115,22,.12) 45%, transparent 68%); }
  #ripples { position: absolute; left: 1130px; top: 170px; width: 800px; height: 800px; z-index: 3; }

  #pip .face img { position: absolute; width: 470px; left: -84px; top: 14px; }
  #pip svg { position: absolute; left: -70px; top: -70px; width: 440px; height: 440px; overflow: visible; }
  #tag { position: absolute; z-index: 8; display: flex; align-items: center; gap: 14px; background: rgba(8,16,12,.72); padding: 8px 16px; border-radius: 12px; }
  #tag .name { font: 800 30px Outfit; } #tag .role { font: italic 500 22px 'Playfair Display', serif; color: #e0b25c; }
  #tag .eq { display: flex; gap: 4px; align-items: center; height: 30px; }
  #tag .eq i { display: block; width: 5px; border-radius: 3px; background: #f97316; }
  #lower { position: absolute; left: 1010px; top: 960px; z-index: 8; overflow: hidden; }
  #lower .in { background: #f4ecdc; color: #101a14; border-radius: 14px; padding: 14px 24px; display: flex; gap: 16px; align-items: baseline; }

  #cta { position: absolute; left: 96px; top: 880px; z-index: 8; display: flex; gap: 22px; align-items: center; }
  #cta .btn { background: linear-gradient(90deg, #f97316, #f5b041); color: #1a0d02; font: 800 34px Outfit; padding: 18px 34px; border-radius: 999px; box-shadow: 0 16px 40px rgba(249,115,22,.35); }

  #chapters i b { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, #f97316, #f5b041); }
</style></head>

<script>
const CHAPTER = { hook: 'THE RISK', books: 'THE PROBLEM', register: 'THE FIX', files: 'THE RULES', receipt: 'THE PROOF', app: 'THE APP', game: 'THE GAME', honest: 'THE TRUTH', close: 'JOIN' };
let S = null, ENV = {}, TOTAL = 0;
const HOLD = 1.2, LEAD = 0.45, CLOSE_HOLD = 3.6, FPS = 30;
async function load() {
  S = await (await fetch('script.json')).json();
  ENV = await (await fetch('audio/env.json')).json();
  let t = 0;
  S.scenes.forEach((sc, i) => { sc.i = i; sc.start = t; sc.speak = t + LEAD; sc.dur = LEAD + sc.voice_s + (i === S.scenes.length - 1 ? CLOSE_HOLD : HOLD); t += sc.dur; sc.timing = wordTimes(sc); });
  TOTAL = t; S.total = t;
  buildBooks(); buildReceipts(); buildBarcode(); buildHonest();
  document.getElementById('chapters').innerHTML = S.scenes.map(() => '<i><b></b></i>').join('');
  window.__ready = true;
  return S;
}
// When each word starts, as a share of the line: weighted by length, with pauses after commas and full stops.
function wordTimes(sc) {
  const words = sc.line.split(' '); let acc = 0; const at = [];
  words.forEach(w => { at.push(acc); acc += w.length + 1 + (/[,]$/.test(w) ? 4 : 0) + (/[.?!]$/.test(w) ? 8 : 0); });
  return { words, at: at.map(a => a / acc) };
}
function buildBooks() {
  const g = document.getElementById('books'); let h = '';
  for (let i = 0; i < 26; i++) {
    const col = i % 6, row = Math.floor(i / 6), x = 70 + col * 135, y = 140 + row * 120, a = (0.03 + i * 0.016).toFixed(3), b = (0.08 + i * 0.016).toFixed(3);
    const hot = i === 8 || i === 21;
    h += `<rect class="c" x="${x}" y="${y}" width="105" height="84" rx="6" pathLength="1" data-a="draw ${a} ${b}"/><path class="c" d="M${x + 52} ${y} V${y + 84}" pathLength="1" data-a="draw ${a} ${b}"/>`;
    if (hot) h += `<rect class="o" x="${x - 6}" y="${y - 6}" width="117" height="96" rx="9" pathLength="1" data-a="draw .62 .72"/><circle cx="${x + 52}" cy="${y + 42}" r="20" fill="#f97316" data-a="pop .66 .74"/>`;
  }
  h += `<path class="o" d="M${70 + 2 * 135 + 52} ${140 + 1 * 120 + 62} C 520 580, 700 620, ${70 + 3 * 135 + 52} ${140 + 3 * 120 + 22}" pathLength="1" data-a="draw .72 .84"/>`;
  h += `<text class="to" x="464" y="880" text-anchor="middle" data-a="pop .8 .9">SAME TONNE, TWO BOOKS</text>`;
  g.innerHTML = h;
}
function buildReceipts() {
  const g = document.getElementById('receipt'); let h = ''; const xs = [50, 270, 490, 710];
  const hashes = ['a3f9', '7c21', 'e04b', '19d6'];
  xs.forEach((x, i) => {
    const a = (0.02 + i * 0.08).toFixed(2), b = (0.1 + i * 0.08).toFixed(2);
    h += `<rect class="c" x="${x}" y="130" width="170" height="210" rx="8" pathLength="1" data-a="draw ${a} ${b}"/>`;
    h += `<text class="tg" x="${x + 85}" y="185" text-anchor="middle" data-a="fade ${b} ${(+b + .05).toFixed(2)}">#${i + 1}</text>`;
    h += `<path class="c" d="M${x + 25} 225 H${x + 145} M${x + 25} 260 H${x + 120}" pathLength="1" data-a="draw ${b} ${(+b + .05).toFixed(2)}"/>`;
    h += `<text class="mono" x="${x + 85}" y="315" text-anchor="middle" style="font-size:28px" data-a="fade ${b} ${(+b + .06).toFixed(2)}">${hashes[i]}…</text>`;
    if (i) h += `<path class="g" d="M${x - 50} 235 H${x}" pathLength="1" marker-end="url(#ah)" data-a="draw ${b} ${(+b + .04).toFixed(2)}"/>`;
    h += `<path class="c" d="M${x + 85} 340 L464 490" pathLength="1" data-a="draw .4 .54"/>`;
  });
  h += `<circle class="g" cx="464" cy="530" r="48" pathLength="1" data-a="draw .52 .6"/><text class="tg" x="464" y="541" text-anchor="middle" data-a="fade .56 .62">ROOT</text>`;
  h += `<path class="c" d="M464 580 V660" pathLength="1" marker-end="url(#ah)" data-a="draw .6 .66"/>`;
  h += `<circle class="c" cx="464" cy="760" r="95" pathLength="1" data-a="draw .64 .74"/><text class="t" x="464" y="752" text-anchor="middle" data-a="fade .7 .76">SOLANA</text><text class="tg" x="464" y="792" text-anchor="middle" style="font-size:24px" data-a="fade .72 .78">DEVNET</text>`;
  h += `<path class="o" d="M600 750 l30 30 l60 -70" pathLength="1" data-a="draw .8 .88"/>`;
  g.innerHTML = h;
}
function buildBarcode() {
  let h = '', x = 350; const w = [3, 6, 2, 4, 8, 2, 3, 6, 2, 5, 3, 7, 2, 4, 3, 6, 2, 8, 3, 4, 2, 6, 3, 5];
  w.forEach((ww, i) => { h += `<rect x="${x}" y="200" width="${ww}" height="150" fill="#efe6cf"/>`; x += ww + (i % 3 === 0 ? 7 : 5); });
  document.getElementById('barcode').innerHTML = h;
}
function buildHonest() {
  const left = ['Receipt and hash', 'Serial range', 'Solana devnet record'], right = ['Field video', 'Satellite imagery', 'Named verifier'];
  let h = '';
  left.forEach((s, i) => { const y = 270 + i * 130, a = (0.12 + i * 0.06).toFixed(2), b = (0.18 + i * 0.06).toFixed(2);
    h += `<path class="gr" d="M95 ${y - 12} l16 16 l30 -34" pathLength="1" data-a="draw ${a} ${b}"/><text class="t" x="150" y="${y}" style="font-size:26px" data-a="fade ${a} ${b}">${s}</text>`; });
  right.forEach((s, i) => { const y = 270 + i * 130, a = (0.46 + i * 0.06).toFixed(2), b = (0.52 + i * 0.06).toFixed(2);
    h += `<circle class="c" cx="525" cy="${y - 12}" r="17" pathLength="1" data-a="draw ${a} ${b}"/><text class="t" x="560" y="${y}" style="font-size:26px;opacity:.75" data-a="fade ${a} ${b}">${s}</text>`; });
  document.getElementById('honestRows').innerHTML = h;
}

const clamp = v => Math.max(0, Math.min(1, v));
const ease = k => 1 - Math.pow(1 - k, 3);
const back = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };   // overshoot, for pops
// loudness of the voice at time t, 0 to 1, smoothed over three frames
function amp(sc, t) {
  const e = ENV[sc.id] || [], f = (t - sc.speak) * FPS;
  if (f < 0 || f >= e.length) return 0;
  const i = Math.floor(f); return ((e[i - 1] ?? e[i]) + 2 * e[i] + (e[i + 1] ?? e[i])) / 4;
}
// deterministic noise for the floating motes
const rnd = i => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };

function render(t) {
  const cur = S.scenes.find(sc => t >= sc.start && t < sc.start + sc.dur) || S.scenes.at(-1);
  const prev = S.scenes[cur.i - 1], local = t - cur.start, hero = cur.avatar === 'hero';
  const a = amp(cur, t), kin = ease(clamp(local / 0.5));
  const changedMode = !prev || prev.avatar !== cur.avatar;

  // camera: slow push-in through each scene, reset hidden under the wipe
  document.getElementById('cam').style.transform = `scale(${1 + 0.018 * clamp(local / cur.dur)})`;
  document.getElementById('dots').style.transform = `translate(${(t * 6) % 16}px, ${(t * 3) % 16}px)`;
  const glow = document.getElementById('glow');
  glow.style.left = `${hero ? 900 + Math.sin(t * .3) * 60 : 120 + Math.sin(t * .25) * 120}px`; glow.style.top = `${-60 + Math.cos(t * .2) * 80}px`;
  let m = ''; for (let i = 0; i < 40; i++) { const y = 1100 - ((t * (12 + rnd(i) * 22) + rnd(i + 99) * 1100) % 1160), x = rnd(i + 7) * 1920 + Math.sin(t * .5 + i) * 14;
    m += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1 + rnd(i + 3) * 2.2).toFixed(1)}" fill="${i % 4 ? '#f4ecdc' : '#f5b041'}" opacity="${(.12 + rnd(i + 5) * .25).toFixed(2)}"/>`; }
  document.getElementById('motes').innerHTML = m;

  // chapters
  document.querySelectorAll('#chapters b').forEach((b, i) => { const sc = S.scenes[i]; b.style.width = `${clamp((t - sc.start) / sc.dur) * 100}%`; });

  // card: hidden while Rume is full body, slides in from the left when the portrait takes over
  const card = document.getElementById('card');
  const cardIn = hero ? 0 : (changedMode ? ease(clamp(local / 0.6)) : 1);
  const cardOut = (!hero && cur.i === S.scenes.length - 2) ? clamp((cur.start + cur.dur - t) / 0.4) : 1;
  card.style.opacity = cardIn * cardOut; card.style.transform = `translateX(${(1 - cardIn) * -120}px) scale(${0.96 + 0.04 * cardIn})`;
  document.getElementById('chip').innerHTML = `${String(cur.i + 1).padStart(2, '0')} <span>/ ${String(S.scenes.length).padStart(2, '0')}</span>  ${CHAPTER[cur.id]}`;
  for (const sc of S.scenes) {
    const g = document.querySelector(`[data-scene="${sc.id}"]`); if (!g) continue;
    const l = t - sc.start, span = sc.voice_s + LEAD + 0.6, inScene = sc === cur;
    g.style.opacity = inScene ? Math.min(clamp((sc.start + sc.dur - t) / 0.3), clamp(l / 0.25)) : 0;
    if (!inScene) continue;
    g.querySelectorAll('[data-a]').forEach(el => {
      const [kind, x0, x1, extra] = el.dataset.a.split(' ');
      const p = ease(clamp((l / span - +x0) / (+x1 - +x0)));
      if (kind === 'draw') { el.style.strokeDasharray = '1 1'; el.style.strokeDashoffset = 1 - p; }
      else if (kind === 'fade') el.style.opacity = p;
      else if (kind === 'pop') { const k = clamp((l / span - +x0) / (+x1 - +x0)); el.style.opacity = clamp(k * 3); el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; el.style.transform = `scale(${k ? 0.5 + 0.5 * back(k) : 0.5})`; }
      else if (kind === 'grow') el.setAttribute('width', (+extra) * p);
      else if (kind === 'sweep') { const k = clamp((l / span - +x0) / (+x1 - +x0)); el.style.opacity = k > 0 && k < 1 ? 1 : 0; el.style.transform = `translateY(${Math.sin(k * Math.PI) * +extra}px)`; }
    });
  }

  // caption: italic lead-in, then the keyword lines rising word by word, highlighter under the accent line
  const cap = document.getElementById('cap');
  Object.assign(cap.style, hero ? { left: '96px', top: '230px' } : { left: '1010px', top: '150px' });
  const longest = Math.max(...cur.caption.map(l => l.length)), big = Math.min(hero ? 196 : 124, Math.floor((hero ? 1060 : 840) / (longest * 0.7)));
  const leadK = ease(clamp((local - 0.05) / 0.4));
  let h = `<div class="lead" style="opacity:${leadK};transform:translateX(${(1 - leadK) * -30}px);font-size:${hero ? 72 : 54}px">${cur.lead}</div><div class="big" style="font-size:${big}px">`;
  cur.caption.forEach((ln, li) => {
    const words = ln.split(' ');
    h += `<span class="ln">`;
    words.forEach((w, wi) => { const k = clamp((local - 0.15 - li * 0.18 - wi * 0.08) / 0.45), e = back(k);
      h += `<span class="w${li === cur.accent ? ' hot' : ''}" style="opacity:${clamp(k * 2.5)};transform:translateY(${(1 - e) * 70}px);filter:blur(${(1 - clamp(k * 1.6)) * 10}px)">${w}</span>${wi < words.length - 1 ? ' ' : ''}`; });
    if (li === cur.accent) h += `<i class="bar" style="width:${ease(clamp((local - 0.6) / 0.5)) * 100}%"></i>`;
    h += `</span>`;
  });
  cap.innerHTML = h + '</div>';
  cap.style.opacity = clamp((cur.start + cur.dur - t) / 0.3);

  // subtitle: the spoken line, word by word with the voice, the newest word in gold
  const sub = document.getElementById('sub');
  Object.assign(sub.style, hero ? { left: '100px', top: '700px', width: '1000px', fontSize: '40px' } : { left: '1012px', top: '520px', width: '520px', fontSize: '36px' });
  const prog = (t - cur.speak) / cur.voice_s, T = cur.timing;
  sub.innerHTML = T.words.map((w, i) => { if (prog < T.at[i]) return ''; const nxt = T.at[i + 1] ?? 1, k = clamp((prog - T.at[i]) / 0.03);
    return prog < nxt ? `<em style="opacity:${k}">${w}</em>` : `<span>${w}</span>`; }).join(' ');
  sub.style.opacity = clamp((cur.start + cur.dur - t) / 0.3);

  // presenter, full body: enters from the right, breathes, leans with the voice; warm light and ripples follow loudness
  const heroEl = document.getElementById('hero'), hg = document.getElementById('heroGlow'), rip = document.getElementById('ripples');
  if (hero) {
    const k = changedMode ? back(clamp(local / 0.8)) : 1, out = cur.i === S.scenes.length - 1 ? 1 : clamp((cur.start + cur.dur - t) / 0.4);
    heroEl.style.opacity = clamp(k) * out;
    heroEl.style.transform = `translate(${(1 - k) * 260}px, ${Math.sin(t * 1.6) * 5 - a * 6}px) rotate(${Math.sin(t * .7) * .5 + a * .6}deg) scale(${1 + a * .012})`;
    hg.style.opacity = (.45 + a * .55) * clamp(k) * out; hg.style.transform = `scale(${1 + a * .08})`;
    let r = ''; for (let i = 0; i < 3; i++) { const ph = ((t * .45 + i / 3) % 1); r += `<circle cx="400" cy="400" r="${180 + ph * 220}" fill="none" stroke="#f5b041" stroke-width="2" opacity="${((1 - ph) * (.15 + a * .5) * out).toFixed(3)}"/>`; }
    rip.innerHTML = r; rip.style.opacity = clamp(k);
  } else { heroEl.style.opacity = 0; hg.style.opacity = 0; rip.innerHTML = ''; }

  // presenter, portrait: pops in, a ring of bars around it moves with the voice
  const pip = document.getElementById('pip');
  if (!hero) {
    const k = changedMode ? back(clamp((local - 0.2) / 0.6)) : 1, out = cur.i === S.scenes.length - 2 ? clamp((cur.start + cur.dur - t) / 0.4) : 1;
    pip.style.opacity = clamp(k * 2) * out;
    pip.style.transform = `translateY(${Math.sin(t * 1.8) * 4}px) scale(${(0.6 + 0.4 * k) * (1 + a * .03)})`;
    let s = `<circle r="160" fill="none" stroke="url(#rg)" stroke-width="${5 + a * 5}" opacity=".95"/>
      <defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#f5b041"/></linearGradient></defs>`;
    for (let i = 0; i < 64; i++) { const ang = i / 64 * Math.PI * 2 + t * .15, len = 4 + 34 * a * (.45 + .55 * Math.abs(Math.sin(i * 1.7 + t * 7)));
      const r0 = 172, r1 = r0 + len;
      s += `<line x1="${(Math.cos(ang) * r0).toFixed(1)}" y1="${(Math.sin(ang) * r0).toFixed(1)}" x2="${(Math.cos(ang) * r1).toFixed(1)}" y2="${(Math.sin(ang) * r1).toFixed(1)}" stroke="${i % 2 ? '#f5b041' : '#f97316'}" stroke-width="4" stroke-linecap="round" opacity="${(.35 + a * .6).toFixed(2)}"/>`; }
    document.getElementById('ring').innerHTML = s;
  } else pip.style.opacity = 0;

  // name tag beside the portrait (or under the full body), with a small live meter
  const tag = document.getElementById('tag');
  Object.assign(tag.style, hero ? { left: '1300px', top: '1000px' } : { left: '1590px', top: '1010px' });
  let eq = ''; for (let i = 0; i < 5; i++) eq += `<i style="height:${6 + 24 * a * (.5 + .5 * Math.abs(Math.sin(t * 11 + i * 1.3)))}px"></i>`;
  tag.innerHTML = hero ? `<span class="eq">${eq}</span><span class="name">Rume Dominic</span><span class="role">co-founder</span>` : `<span class="eq">${eq}</span><span class="name" style="font-size:22px;letter-spacing:.08em">RUME DOMINIC</span>`;
  tag.style.opacity = hero ? clamp((local - .6) / .4) * (cur.i === S.scenes.length - 1 ? 1 : clamp((cur.start + cur.dur - t) / 0.4)) : (pip.style.opacity || 0);

  // lower third, once, when Rume introduces himself
  const lower = document.getElementById('lower');
  if (cur.nametag) { const k = ease(clamp((local - .5) / .5)) * clamp((cur.speak + 4.2 - t) / .4);
    lower.style.opacity = k; lower.firstElementChild.style.transform = `translateY(${(1 - k) * 80}px)`; Object.assign(lower.style, { left: '1010px', top: '960px' });
  } else lower.style.opacity = 0;

  // call to action on the close
  const cta = document.getElementById('cta');
  if (cur.id === 'close') { const k = back(clamp((t - cur.speak - cur.voice_s * .55) / .6)); cta.style.opacity = clamp(k * 2); cta.style.transform = `translateY(${(1 - k) * 40}px)`; }
  else cta.style.opacity = 0;

  // wipe between scenes: two diagonal bands, orange then dark, sweep across the cut
  const W = document.getElementById('wipe'); let wp = '';
  for (const sc of S.scenes) { if (!sc.i) continue; const d = t - sc.start;
    if (d > -0.3 && d < 0.3) { const k = (d + 0.3) / 0.6, x = -700 + k * 3300;
      wp += `<polygon points="${x},0 ${x + 380},0 ${x + 80},1080 ${x - 300},1080" fill="#f97316"/><polygon points="${x - 360},0 ${x + 20},0 ${x - 280},1080 ${x - 660},1080" fill="#0b1510"/>`; } }
  W.innerHTML = wp;
}
window.render = render; window.load = load;
// preview: open index.html?play to watch in real time (silent)
if (location.search.includes('play')) load().then(() => { const t0 = performance.now(); const f = () => { render((performance.now() - t0) / 1000 % TOTAL); requestAnimationFrame(f); }; f(); });
</script></body></html>
