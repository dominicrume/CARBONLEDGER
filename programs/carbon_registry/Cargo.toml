[package]
name = "carbon_registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "carbon_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# ASSUMPTION: pin the Anchor version your toolchain installs (check `anchor --version`), then re-run `anchor build`.
# init-if-needed is deliberately NOT enabled: it allows re-initialisation attacks and no instruction here needs it.
anchor-lang = { version = "0.31.1" }
