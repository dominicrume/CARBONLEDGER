[package]
name = "carbon_registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "carbon_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# ASSUMPTION: pin the Anchor version your toolchain installs (check `anchor --version`), then re-run `anchor build`.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
