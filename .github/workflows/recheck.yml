name: nightly recheck
# Security stage 01: re-run every invariant and compare anchored hashes on the real database, every night.
# Needs the repository secret DATABASE_URL_RECHECK (a read-only role is enough). Fails loudly; a failure pages
# whoever watches this workflow. Nothing runs if the secret is absent.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recheck:
    runs-on: ubuntu-latest
    if: ${{ vars.RECHECK_ENABLED == '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: recheck
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RECHECK }}
        run: python scripts/recheck.py
