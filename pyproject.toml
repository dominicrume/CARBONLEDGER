[project]
name = "carbonledger"
version = "0.1.0"
description = "CarbonLedger: a single register for carbon units, with human-safe controls. Solana first."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
solana = ["solders>=0.21"]
dev = ["pytest>=8.0", "pip-audit>=2.7", "solders>=0.21"]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "services/api"]
